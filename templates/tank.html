{% extends 'layout.html' %}

{% block title %}
    Tank
{% endblock %}

{% block main %}
    <div class="container">
        <h3 style="text-align: center;">Tanks</h3>
        <br>
        <div class="accordion" id="accordion">
            {% for location in tanks.keys() %}
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button type="button" class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ location }}" aria-expanded="true" aria-controls="collapse-{{ location }}">
                            {{ location }}
                        </button>
                    </h2>
                    {% for tank in tanks[location] %}
                        <div class="accordion-collapse collapse show" id="collapse-{{ location }}" data-bs-parent="accordion">
                            <div class="accordion-body">
                                <div class="row">
                                    <div class="col text-start">
                                        <h5>
                                            Id  - {{ tank[0] }}
                                        </h5>
                                    </div>
                                    <div class="col text-end">
                                        <h5>
                                            Available Water - {{ tank[1] }} %
                                        </h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
