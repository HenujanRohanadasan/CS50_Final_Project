{% extends 'layout.html' %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="container">
        <h1>Register</h1>
        <br>
        <div>
            <form action="/register" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="username" class="form-control" id="username" name="username" placeholder="Username" autofocus autocomplete="off">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password" autocomplete="off">
                </div>
                <div class="mb-3">
                    <label for="password_confirm" class="form-label">Password</label>
                    <input type="password_confirm" class="form-control" id="password_confirm" placeholder="password_confirm" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
{% endblock %}
